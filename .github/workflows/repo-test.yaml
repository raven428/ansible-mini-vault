# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
# cspell:ignore dependabot LINTIGNORE
---
name: repo test
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "11 11 * * 1"
  # checkov:skip=CKV_GHA_7
  workflow_dispatch:
    inputs:
      mega_var_ref:
        description: "ansible-mega-var branch/tag to test against"
        required: false
        type: string
        default: ""
      mega_launch_ref:
        description: "ansible-launch-var branch/tag to test against"
        required: false
        type: string
        default: ""
      mega_service_ref:
        description: "ansible-service-var branch/tag to test against"
        required: false
        type: string
        default: ""
permissions: {}
env:
  MEGA_VAR_REF: ${{ inputs.mega_var_ref }}
  MEGA_LAUNCH_REF: ${{ inputs.mega_launch_ref }}
  MEGA_SERVICE_REF: ${{ inputs.mega_service_ref }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  default:
    name: t
    # jscpd:ignore-start
    if: github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    permissions:
      contents: read
    timeout-minutes: 33
    runs-on: ubuntu-24.04
    # jscpd:ignore-end
    strategy:
      fail-fast: false
      matrix:
        call_mode:
          - def1
          - def2
        ansible_ver:
          - "06"
          - "07"
          - "08"
          - "09"
          - "10"
          - "11"
    steps:
      # jscpd:ignore-start
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      # jscpd:ignore-end
      - name: test role
        env:
          ANSIBLE_VER: "${{ matrix.ansible_ver }}"
          ANSIBLE_CALL_MODE: ${{ matrix.call_mode }}
        run: molecule/default/run-tests.sh
  linters:
    name: linters
    # jscpd:ignore-start
    if: github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    permissions:
      contents: read
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    # jscpd:ignore-end
    steps:
      # jscpd:ignore-start
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      # jscpd:ignore-end
      - name: lint the repo
        shell: bash
        env:
          BRA: master
          USE_LINTIGNORE: true
        run: |
          curl -fsL \
          https://raw.githubusercontent.com/megalomania428/container-images/refs/heads/${{
          env.BRA }}/sources/linters-ubuntu-22_04/check-dir.sh | bash
          curl -fsL \
          https://raw.githubusercontent.com/megalomania428/container-images/refs/heads/${{
          env.BRA }}/_shared/install/ansible/check-dir.sh | bash
          tests/run-tests.sh
  MegaLinter:
    name: MegaLinter
    # jscpd:ignore-start
    if: github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    permissions:
      contents: read
    timeout-minutes: 11
    runs-on: ubuntu-24.04
    # jscpd:ignore-end
    steps:
      # jscpd:ignore-start
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      # jscpd:ignore-end
      - name: Run MegaLinter
        uses: megalomania428/github-actions/megalinter@master
  all-green:
    name: all green
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    needs:
      - default
      - linters
      - MegaLinter
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Check dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")'
